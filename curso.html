<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Módulo 8 | Escola Missionária</title>

<style>
:root{
  --roxo:#352c86;
  --fundo:#f4f6fa;
  --texto:#24243a;
  --cinza:#74758a;
  --verde:#18bda8;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:var(--fundo);
  color:var(--texto);
}

header{
  background:linear-gradient(135deg,#352c86,#44389b);
  color:#fff;
  padding:14px;
  position:sticky;
  top:0;
  z-index:10;
}

.top{
  max-width:1000px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:12px;
}

.voltar{
  color:#fff;
  text-decoration:none;
  background:#ffffff20;
  padding:9px 12px;
  border-radius:10px;
}

.wrap{
  max-width:1000px;
  margin:auto;
  padding:16px;
}

.box{
  background:#fff;
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 3px 14px #2520600b;
}

.small{
  font-size:11px;
  color:var(--cinza);
  font-weight:700;
}

h1{
  font-size:23px;
  margin:6px 0;
}

.descricao{
  color:var(--cinza);
  font-size:13px;
}

.video{
  aspect-ratio:16/9;
  background:#111;
  border-radius:13px;
  overflow:hidden;
  margin-top:12px;
}

.video iframe{
  width:100%;
  height:100%;
  border:0;
}

.aula{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  border:1px solid #e7e7ee;
  background:#fff;
  border-radius:12px;
  padding:13px;
  margin:8px 0;
  text-align:left;
  cursor:pointer;
  color:var(--texto);
}

.aula.ativa{
  border:2px solid var(--roxo);
  background:#f4f2ff;
}

.numero{
  width:36px;
  height:36px;
  flex:0 0 36px;
  border-radius:50%;
  background:#eeecfb;
  color:var(--roxo);
  display:grid;
  place-items:center;
  font-weight:800;
}

.aula.ativa .numero{
  background:var(--roxo);
  color:#fff;
}

.aula b{
  display:block;
  font-size:14px;
}

.aula span{
  font-size:11px;
  color:var(--cinza);
}

.proxima{
  display:flex;
  justify-content:flex-end;
  margin-top:14px;
}

.proxima button{
  border:0;
  border-radius:10px;
  padding:12px 16px;
  background:var(--roxo);
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

@media(max-width:700px){
  .wrap{padding:10px}
  .box{padding:14px}
  h1{font-size:20px}
}
</style>
</head>

<body>

<header>
  <div class="top">
    <a class="voltar" href="index.html">‹ Início</a>

    <div>
      <b>GRADUAÇÃO MISSIONÁRIA</b>
      <div style="font-size:10px;opacity:.8">
        Módulo 8
      </div>
    </div>
  </div>
</header>

<main class="wrap">

<section class="box">
  <div class="small">CURSO ATUAL • MÓDULO 8</div>

  <h1>
    Jesus, o Cristo Ecumênico, o Divino Estadista II
  </h1>

  <div class="descricao">
    Selecione uma das cinco aulas abaixo.
  </div>
</section>

<section class="box">

  <div class="small" id="contador">
    AULA 1 DE 5
  </div>

  <h2 id="tituloAula">
    Aula 1
  </h2>

  <div class="video">
    <iframe
      id="player"
      src="https://www.youtube-nocookie.com/embed/SSxZxVHL62s?rel=0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen>
    </iframe>
  </div>

  <div class="proxima">
    <button id="botaoProxima" onclick="proximaAula()">
      Próxima aula ›
    </button>
  </div>

</section>

<section class="box">

  <div class="small">
    AULAS DO MÓDULO
  </div>

  <h2>5 aulas</h2>

  <button class="aula ativa" onclick="abrirAula(0)">
    <div class="numero">1</div>
    <div>
      <b>Aula 1</b>
      <span>Assistir aula</span>
    </div>
  </button>

  <button class="aula" onclick="abrirAula(1)">
    <div class="numero">2</div>
    <div>
      <b>Aula 2</b>
      <span>Assistir aula</span>
    </div>
  </button>

  <button class="aula" onclick="abrirAula(2)">
    <div class="numero">3</div>
    <div>
      <b>Aula 3</b>
      <span>Assistir aula</span>
    </div>
  </button>

  <button class="aula" onclick="abrirAula(3)">
    <div class="numero">4</div>
    <div>
      <b>Aula 4</b>
      <span>Assistir aula</span>
    </div>
  </button>

  <button class="aula" onclick="abrirAula(4)">
    <div class="numero">5</div>
    <div>
      <b>Aula 5</b>
      <span>Assistir aula</span>
    </div>
  </button>

</section>

</main>

<script>

const videos = [
  "SSxZxVHL62s",
  "F41xAuf3th0",
  "1BP-r5MHKeM",
  "4U8lhuKd5U8",
  "5KrwOSbVnz0"
];

let atual = 0;

function abrirAula(numero){

  atual = numero;

  document.getElementById("contador").textContent =
    "AULA " + (numero + 1) + " DE 5";

  document.getElementById("tituloAula").textContent =
    "Aula " + (numero + 1);

  document.getElementById("player").src =
    "https://www.youtube-nocookie.com/embed/" +
    videos[numero] +
    "?rel=0";

  const aulas = document.querySelectorAll(".aula");

  aulas.forEach(function(aula, indice){
    aula.classList.toggle("ativa", indice === numero);
  });

  const botao =
    document.getElementById("botaoProxima");

  if(numero === 4){
    botao.textContent = "Voltar ao início";
  }else{
    botao.textContent = "Próxima aula ›";
  }

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

function proximaAula(){

  if(atual < 4){
    abrirAula(atual + 1);
  }else{
    window.location.href = "index.html";
  }

}

</script>

</body>
</html>
